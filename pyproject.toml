[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candle"
version = "0.1.2"
description = "A novel-writing tool for Linux, inspired by bibisco"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["PySide6-Essentials>=6.5", "python-docx>=1.0", "typst>=0.15"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
candle = "candle.app:main"

[tool.setuptools]
packages = ["candle", "candle.views"]

[tool.setuptools.package-data]
candle = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
