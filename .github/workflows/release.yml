name: Build and release

# Push a tag like v0.1.0 to build every platform and publish a GitHub release.
# "Run workflow" on the Actions tab builds everything without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/candle.spec --noconfirm
      - name: Installer (Inno Setup is preinstalled on GitHub's Windows runners)
        shell: pwsh
        run: |
          $version = python -c "import candle; print(candle.__version__)"
          iscc /DAppVersion=$version packaging\candle.iss
          Compress-Archive -Path dist\Candle -DestinationPath "dist\Candle-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
      - name: Microsoft Store package (MSIX; Microsoft signs it on submission)
        shell: pwsh
        run: |
          $version = python -c "import candle; print(candle.__version__)"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          New-Item -ItemType Directory msix | Out-Null
          Copy-Item -Recurse dist\Candle\* msix\
          Copy-Item -Recurse packaging\msix\Assets msix\Assets
          (Get-Content packaging\msix\AppxManifest.xml -Raw).Replace('{VERSION}', "$version.0") |
            Set-Content msix\AppxManifest.xml -Encoding utf8
          & $makeappx.FullName pack /d msix /p "dist\Candle-$version-store.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Upload this one to Partner Center by hand; it isn't installable on its own.
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store
          path: dist/*.msix

  macos:
    needs: test
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/candle.spec --noconfirm
      - name: Disk image
        run: |
          version=$(python -c "import candle; print(candle.__version__)")
          mkdir dmg && cp -R dist/Candle.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Candle -srcfolder dmg -ov -format UDZO "dist/Candle-$version-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  snap:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Set up once: see "Publishing the snap" in the README.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
      # Release tags go to the Snap Store's stable channel (skipped until the
      # SNAPCRAFT_STORE_CREDENTIALS secret exists).
      - uses: snapcore/action-publish@v1
        if: startsWith(github.ref, 'refs/tags/') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/snap/*
          generate_release_notes: true
