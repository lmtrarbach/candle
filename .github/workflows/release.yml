name: Build and release

# Push a tag like v0.1.0 to build every platform and publish a GitHub release.
# "Run workflow" on the Actions tab builds everything without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/candle.spec --noconfirm
      - name: Installer (Inno Setup is preinstalled on GitHub's Windows runners)
        shell: pwsh
        run: |
          $version = python -c "import candle; print(candle.__version__)"
          iscc /DAppVersion=$version packaging\candle.iss
          Compress-Archive -Path dist\Candle -DestinationPath "dist\Candle-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  macos:
    needs: test
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/candle.spec --noconfirm
      - name: Disk image
        run: |
          version=$(python -c "import candle; print(candle.__version__)")
          mkdir dmg && cp -R dist/Candle.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Candle -srcfolder dmg -ov -format UDZO "dist/Candle-$version-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  snap:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # "version: git" reads the tag
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
      # To publish to the Snap Store, register the name and add the
      # SNAPCRAFT_STORE_CREDENTIALS secret, then uncomment:
      # - uses: snapcore/action-publish@v1
      #   if: startsWith(github.ref, 'refs/tags/')
      #   env:
      #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      #   with:
      #     snap: ${{ steps.build.outputs.snap }}
      #     release: edge

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
